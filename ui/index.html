<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Studio — Cultural Story Operating System</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --grad-1: #1fc8d8;
    --grad-2: #6a5ae0;
    --grad-3: #b23fd6;
    --grad-4: #ec3a83;
    --grad-5: #ff8a3d;
    --gradient: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4), var(--grad-5));
    --bg: #f7f7f5;
    --bg-soft: #efeee9;
    --panel: #ffffff;
    --border: #e5e3dc;
    --text: #171b34;
    --muted: #6b7085;
    --shadow: 0 1px 2px rgba(23,27,52,.05), 0 10px 30px rgba(23,27,52,.06);
    --ok: #1fae72;
    --warn: #e8a41c;
    --error: #e0435e;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d1a;
      --bg-soft: #11142a;
      --panel: #141830;
      --border: #262b4c;
      --text: #edeefb;
      --muted: #9298ba;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
      --ok: #33d495;
      --warn: #f0b93e;
      --error: #ff5c78;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  a { color: inherit; }
  button, .navitem, .quick-action, .culture-tile, .stat-card, .list-row, input, select, textarea {
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease, opacity .15s ease;
  }

  .app-shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 8px 8px 22px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; box-shadow: 0 2px 8px rgba(80,60,180,.25); }
  .brand-text { line-height: 1.2; }
  .brand-name {
    font-weight: 800; font-size: 15px; letter-spacing: .04em;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }

  .navlist { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none;
    border: 1px solid transparent; position: relative;
  }
  .navitem:hover { background: var(--bg-soft); color: var(--text); }
  .navitem.active { background: var(--bg-soft); color: var(--text); border-color: var(--border); }
  .navitem.active::before {
    content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--gradient);
  }
  .navitem .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gradient); flex-shrink: 0;
    opacity: .35;
  }
  .navitem.active .dot { opacity: 1; }
  .navicon { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .navicon svg { width: 17px; height: 17px; }
  .nav-section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); padding: 14px 12px 4px;
  }
  .navlist > .nav-section-label:first-child { padding-top: 2px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--grad-2); }
  .stat-card .stat-icon {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: var(--gradient); color: white; flex-shrink: 0;
  }
  .stat-card .stat-icon svg { width: 17px; height: 17px; }
  .stat-card .stat-value { font-size: 24px; font-weight: 800; line-height: 1; }
  .stat-card .stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .quick-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .quick-action {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--panel); cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .quick-action:hover { border-color: var(--grad-2); transform: translateY(-1px); }
  .quick-action .qa-icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-soft); color: var(--grad-3); flex-shrink: 0;
  }
  .quick-action .qa-icon svg { width: 18px; height: 18px; }
  .quick-action .qa-label { font-size: 13px; font-weight: 700; }
  .quick-action .qa-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .health-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .health-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
    padding: 5px 10px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border);
  }

  .culture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .culture-tile {
    position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; cursor: pointer;
    background: var(--bg-soft); border: 1px solid var(--border); display: flex; align-items: flex-end;
    transition: transform .15s, box-shadow .15s;
  }
  .culture-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .culture-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .culture-tile-placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 22px; background: var(--gradient); opacity: .18;
  }
  .culture-tile-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--muted); background: var(--bg-soft);
  }
  .culture-tile-label {
    position: relative; z-index: 1; width: 100%; padding: 8px 10px; font-size: 11.5px; font-weight: 700;
    color: #fff; background: linear-gradient(0deg, rgba(0,0,0,.65), transparent);
  }
  .culture-tile-edit {
    position: absolute; top: 8px; right: 8px; z-index: 2; margin: 0; padding: 4px 9px;
    font-size: 10.5px; font-weight: 700; border-radius: 999px; border: none; cursor: pointer;
    background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(2px);
    opacity: 0; transition: opacity .15s;
  }
  .culture-tile:hover .culture-tile-edit, .culture-tile-edit:focus { opacity: 1; }
  .culture-editor { margin-top: 14px; }

  .preview-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .preview-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 11px 13px; background: var(--bg-soft); border-radius: 10px; font-size: 12.5px;
  }
  .preview-row .pr-label { color: var(--text); font-weight: 700; }
  .preview-row .pr-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; max-width: 320px; }
  .preview-row .pr-value {
    font-weight: 700; text-align: right; flex-shrink: 0; padding: 3px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border); font-size: 11.5px; white-space: nowrap;
  }

  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(110%); } }
  @keyframes pulseOrb { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.18); opacity: 1; } }
  .gen-anim { padding: 34px 10px 14px; text-align: center; }
  .gen-orb { width: 44px; height: 44px; border-radius: 50%; background: var(--gradient); margin: 0 auto 20px;
    animation: pulseOrb 1.4s ease-in-out infinite; }
  .gen-bar-track { width: 100%; max-width: 320px; margin: 0 auto; height: 7px; border-radius: 999px;
    background: var(--bg-soft); overflow: hidden; position: relative; }
  .gen-bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 45%; border-radius: 999px;
    background: var(--gradient); animation: sweep 1.3s ease-in-out infinite; }
  .gen-status { margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 600; min-height: 18px; }

  .apikey-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .apikey-box label { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 6px; }
  .apikey-box input {
    width: 100%; background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 32px 36px 60px; max-width: 1000px; }
  .page-head { margin-bottom: 24px; }
  .page-title { font-size: 23px; font-weight: 800; margin: 0 0 5px; letter-spacing: -.01em; }
  .page-sub { font-size: 13.5px; color: var(--muted); margin: 0; max-width: 640px; line-height: 1.55; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 26px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card h3 {
    margin: 0 0 16px; font-size: 12.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
  }
  .card + .card { margin-top: 18px; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea, select, input[type=text], input[type=password], input[type=number] {
    width: 100%; background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 84px; }
  input[type=file] {
    width: 100%; background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 12.5px;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .toggle-option {
    display: flex; align-items: center; gap: 11px; margin-top: 10px; padding: 11px 13px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg-soft);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .toggle-option:hover { border-color: var(--grad-2); }
  .toggle-option.on { border-color: var(--grad-2); background: color-mix(in srgb, var(--grad-2) 8%, var(--bg-soft)); }
  .toggle-option.disabled { opacity: .5; cursor: not-allowed; }
  .toggle-option-icon {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 32px; height: 32px; border-radius: 9px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted);
  }
  .toggle-option.on .toggle-option-icon { color: var(--grad-3); border-color: var(--grad-2); }
  .toggle-option-icon svg { width: 17px; height: 17px; }
  .toggle-option-label { flex: 1; font-size: 12.5px; color: var(--text); font-weight: 500; line-height: 1.4; }
  .toggle-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle-switch-track {
    display: block; width: 38px; height: 22px; border-radius: 999px; background: var(--border);
    position: relative; flex-shrink: 0; transition: background .15s;
  }
  .toggle-option.on .toggle-switch-track { background: var(--gradient); }
  .toggle-switch-thumb {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s;
  }
  .toggle-option.on .toggle-switch-thumb { left: 18px; }

  .lang-chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .lang-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
    font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .lang-chip:hover { border-color: var(--grad-2); }
  .lang-chip.selected { border-color: transparent; background: var(--gradient); color: #fff; }
  .lang-chip svg { width: 12px; height: 12px; }

  .dub-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .dub-tab {
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .dub-tab.active { border-color: var(--grad-2); color: var(--text); background: var(--bg-soft); }
  .dub-tab.failed { color: var(--error); cursor: default; opacity: .7; }

  button.btn {
    margin-top: 18px; border: none; border-radius: 10px; padding: 11px 18px; font-size: 13.5px;
    font-weight: 700; cursor: pointer; color: white; background: var(--gradient);
    background-size: 180% 100%; box-shadow: 0 2px 10px rgba(106,90,224,.28);
    transition: background-position .3s ease, transform .1s ease, box-shadow .15s ease;
  }
  button.btn:hover { background-position: 100% 0; box-shadow: 0 4px 16px rgba(106,90,224,.38); }
  button.btn:active { transform: scale(.98); }
  button.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
  button.btn.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600;
    box-shadow: none;
  }
  button.btn.ghost:hover { border-color: var(--grad-2); background: var(--bg-soft); }
  button.btn.small { margin-top: 0; padding: 7px 12px; font-size: 12px; }
  button.btn.ghost.danger { color: var(--error); border-color: var(--error); display: inline-flex; align-items: center; gap: 5px; }
  button.btn.ghost.danger:hover { background: color-mix(in srgb, var(--error) 12%, transparent); }
  button.btn.ghost.danger svg { width: 13px; height: 13px; }

  .status { margin-top: 12px; font-size: 12.5px; min-height: 16px; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  audio { width: 100%; margin-top: 14px; }
  img.scene-image {
    width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 12px; margin-top: 14px; display: block; background: var(--bg-soft);
  }

  .cover-frame { position: relative; border-radius: 12px; overflow: hidden; margin-top: 14px; }
  .cover-frame img.scene-image { margin-top: 0; border-radius: 0; }
  .cover-title-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 14px;
    background: linear-gradient(to top, rgba(6,7,16,.92), rgba(6,7,16,.55) 60%, transparent);
  }
  .ct-kicker {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px;
    color: rgba(255,255,255,.72); margin-bottom: 4px;
  }
  .ct-title {
    font-size: 15.5px; font-weight: 800; line-height: 1.3; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .audio-card {
    display: flex; gap: 14px; align-items: center; margin-top: 14px; padding: 12px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 14px;
  }
  .audio-thumb {
    width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
    background: var(--gradient); box-shadow: var(--shadow);
  }
  .audio-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .audio-thumb-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .audio-thumb-fallback svg { width: 24px; height: 24px; }
  .audio-card-body { flex: 1; min-width: 0; }
  .audio-card-title {
    font-size: 12px; font-weight: 700; margin-bottom: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .audio-card-body audio { width: 100%; margin-top: 0; display: block; }
  @media (max-width: 480px) {
    .audio-card { flex-direction: column; align-items: stretch; }
    .audio-thumb { width: 100%; height: 150px; border-radius: 12px; }
  }

  .meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .story-output {
    margin-top: 14px; padding: 14px 16px; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 12px; font-size: 13.5px; line-height: 1.7; max-height: 260px; overflow-y: auto;
  }
  .story-output .label { font-size: 10.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 8px; font-weight: 700; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; margin-top: 10px;
  }
  .badge.good { background: rgba(31,174,114,.13); color: var(--ok); }
  .badge.warn { background: rgba(232,164,28,.15); color: var(--warn); }
  .badge.bad { background: rgba(224,67,94,.13); color: var(--error); }
  .badge.neutral { background: var(--bg-soft); color: var(--muted); }

  .list-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
    font-size: 13px; background: var(--panel);
  }
  .list-row .list-main { flex: 1; min-width: 0; }
  .list-row .list-title { font-weight: 700; margin-bottom: 3px; }
  .list-row .list-sub { color: var(--muted); font-size: 11.5px; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; cursor: pointer; background: var(--bg-soft); }
  .avatar-thumb { border-radius: 50%; cursor: default; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--border); }
  .avatar-fallback {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--gradient); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--border);
  }
  .list-actions { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .list-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0; }
  .inline-form { margin-top: 10px; padding: 12px; background: var(--bg-soft); border-radius: 10px; }
  .inline-form textarea { min-height: 56px; }
  .inline-form .row { margin-top: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .comic-panel { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); }

  .dub-source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 4px; }
  .dub-source-card {
    border: 1px solid var(--border); border-radius: 12px; padding: 8px; cursor: pointer;
    background: var(--bg-soft); transition: border-color .15s, box-shadow .15s;
  }
  .dub-source-card:hover { border-color: var(--grad-2); }
  .dub-source-card.selected { border-color: var(--grad-3); box-shadow: 0 0 0 2px color-mix(in srgb, var(--grad-3) 25%, transparent); }
  .dub-source-thumb {
    width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--gradient);
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
  }
  .dub-source-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dub-source-title {
    font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dub-source-lang { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .story-card {
    display: flex; gap: 14px; align-items: flex-start; padding: 14px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow);
  }
  .story-card-thumb {
    width: 76px; height: 76px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: var(--gradient);
  }
  .story-card-thumb.clickable { cursor: pointer; }
  .story-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story-card-thumb-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .story-card-thumb-fallback svg { width: 26px; height: 26px; }
  .story-card-body { flex: 1; min-width: 0; }
  .story-card-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; line-height: 1.4; }

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const API_BASE = "http://178.104.214.191:8604";
// Pre-filled default so this doesn't 401 out of the box. This is a public,
// static HTML file - anyone who views source can read this value, so it
// must never be a billing-relevant secret (OpenAI key etc.), only this
// service's own request-gating key.
const DEFAULT_API_KEY = "hqC3S-oePGWbMot_HuwmvI-YqrrGoa58lKqJh8nnFhg";

const LANGUAGES = [
  ["hin", "Hindi"], ["tam", "Tamil"], ["tel", "Telugu"], ["mal", "Malayalam"],
  ["kan", "Kannada"], ["mar", "Marathi"], ["guj", "Gujarati"], ["ben", "Bengali"],
  ["pan", "Punjabi"], ["ory", "Odia"], ["asm", "Assamese"],
];

const EMOTIONS = ["auto", "neutral", "happy", "sad", "excited", "calm", "horror", "romance", "action", "comedy", "devotional", "mystery"];

function useApiKey() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("infinity_studio_api_key") || DEFAULT_API_KEY);
  useEffect(() => { localStorage.setItem("infinity_studio_api_key", apiKey); }, [apiKey]);
  return [apiKey, setApiKey];
}

function authHeaders(apiKey) {
  return apiKey ? { "x-api-key": apiKey } : {};
}

function b64ToUtf8(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

// A short, native-script snippet of the actual content to use as an
// AudioPlayerCard title - real text in whatever language it's actually
// in, not a generic English label like "Narration" for every result.
function truncateTitle(text, maxLen = 46) {
  if (!text) return "";
  const trimmed = text.trim();
  return trimmed.length > maxLen ? trimmed.slice(0, maxLen).trim() + "…" : trimmed;
}

async function readError(resp) {
  let detail = resp.statusText;
  try { detail = (await resp.json()).detail || detail; } catch (e) {}
  return `${resp.status}: ${detail}`;
}

function qualityBadge(headers) {
  const scored = headers.get("X-Quality-Scored") === "true";
  if (!scored) return null;
  const overall = parseInt(headers.get("X-Quality-Overall") || "0", 10);
  const rewritten = headers.get("X-Quality-Rewritten") === "true";
  let cls = "good";
  if (overall < 50) cls = "bad"; else if (overall < 65) cls = "warn";
  return (
    <span className={`badge ${cls}`}>
      ✦ Quality {overall}/100{rewritten ? " · auto-rewritten" : ""}
    </span>
  );
}

function Field({ label: labelText, children, hint }) {
  return (
    <div>
      <label>{labelText}</label>
      {children}
      {hint && <div className="hint">{hint}</div>}
    </div>
  );
}

function LangSelect({ value, onChange }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)}>
      {LANGUAGES.map(([code, name]) => <option key={code} value={code}>{name}</option>)}
    </select>
  );
}

/* A labeled on/off option with an icon identifying what it controls (BGM,
   thumbnail, video, avatars, ...) and a proper switch instead of a bare
   native checkbox - used anywhere a generation request has an optional,
   cost/latency-affecting extra. */
function ToggleOption({ id, icon, label, checked, onChange, disabled }) {
  return (
    <label htmlFor={id} className={`toggle-option ${checked ? "on" : ""} ${disabled ? "disabled" : ""}`}>
      <span className="toggle-option-icon"><Icon name={icon} /></span>
      <span className="toggle-option-label">{label}</span>
      <span className="toggle-switch">
        <input type="checkbox" id={id} checked={checked} disabled={disabled}
          onChange={(e) => onChange(e.target.checked)} />
        <span className="toggle-switch-track"><span className="toggle-switch-thumb" /></span>
      </span>
    </label>
  );
}

/* A large generated illustration presented like a movie/audiobook poster -
   the real image, full width, with the story's own title burned into a
   bottom gradient scrim (never text laid over empty space, and never a
   generic label - always the actual native-language title/excerpt the
   caller passes in). Used wherever a scene/cover image is shown at full
   size, not the small round-cornered thumbnail inside AudioPlayerCard. */
function CoverArt({ src, title, kicker, alt }) {
  if (!src) return null;
  return (
    <div className="cover-frame">
      <img className="scene-image" src={src} alt={alt || title || "Cover"} />
      {title && (
        <div className="cover-title-scrim">
          {kicker && <div className="ct-kicker">{kicker}</div>}
          <div className="ct-title">{title}</div>
        </div>
      )}
    </div>
  );
}

/* A responsive "album art + player" card used everywhere a story's audio
   result is shown. thumbnailUrl is whatever real image the story already
   has (scene illustration, cover image, character avatar) - never
   generated just for this card. Without one, a gradient icon fills the
   same frame so every result reads consistently, not a layout that only
   works when an image happens to exist. object-fit: cover in the CSS is
   what makes an arbitrary source image "fit the frame" without distortion,
   regardless of its own aspect ratio. */
function AudioPlayerCard({ audioUrl, thumbnailUrl, title, icon, audioRef, onTimeUpdate }) {
  if (!audioUrl) return null;
  return (
    <div className="audio-card">
      <div className="audio-thumb">
        {thumbnailUrl
          ? <img src={thumbnailUrl} alt={title || "Cover"} />
          : <div className="audio-thumb-fallback"><Icon name={icon || "narrate"} /></div>}
      </div>
      <div className="audio-card-body">
        {title && <div className="audio-card-title">{title}</div>}
        <audio ref={audioRef} controls autoPlay src={audioUrl} onTimeUpdate={onTimeUpdate} />
      </div>
    </div>
  );
}

/* ---------------- Narrate ---------------- */
const EMOTION_INFO = {
  auto: { label: "Auto-detect", desc: "AI reads your text and picks the mood automatically." },
  neutral: { label: "Neutral", desc: "Calm, balanced pacing, no strong mood." },
  happy: { label: "Happy", desc: "Bright, upbeat chords with a playful bounce." },
  sad: { label: "Sad", desc: "Slow, minor-toned and wistful." },
  excited: { label: "Excited", desc: "Fast, energetic, rising energy." },
  calm: { label: "Calm", desc: "Soft, sparse and meditative." },
  horror: { label: "Horror", desc: "Dissonant, tense chords with an unsettling edge." },
  romance: { label: "Romance", desc: "Warm, lush major-seventh chords." },
  action: { label: "Action", desc: "Fast, driving rhythm with urgency." },
  comedy: { label: "Comedy", desc: "Light, bouncy and playful." },
  devotional: { label: "Devotional", desc: "Sparse sustained drone, meditative." },
  mystery: { label: "Mystery", desc: "Slow-building tension with an uneasy edge." },
};

function GeneratingAnimation({ bgm, images }) {
  const messages = ["Synthesizing speech…", "Shaping pronunciation…"];
  if (bgm) messages.push("Mixing background music…");
  if (images) messages.push("Painting the scene…");
  messages.push("Almost there…");
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setIdx((i) => (i + 1) % messages.length), 1400);
    return () => clearInterval(id);
  }, [messages.length]);
  return (
    <div className="gen-anim">
      <div className="gen-orb"></div>
      <div className="gen-bar-track"><div className="gen-bar-fill"></div></div>
      <div className="gen-status">{messages[idx]}</div>
    </div>
  );
}

function NarratePanel({ apiKey }) {
  const [text, setText] = useState("நமஸ்தே, இன்று வானிலை மிகவும் அழகாக உள்ளது.");
  const [language, setLanguage] = useState("");
  const [emotion, setEmotion] = useState("");
  const [speed, setSpeed] = useState(1.0);
  const [bgm, setBgm] = useState(false);
  const [withImages, setWithImages] = useState(true);
  const [maxImages, setMaxImages] = useState(1);
  const [cultureAdapt, setCultureAdapt] = useState(false);
  const [step, setStep] = useState("compose"); // compose | preview | generating | result
  const [status, setStatus] = useState({ text: "", cls: "" });
  const [audioUrl, setAudioUrl] = useState(null);
  const [meta, setMeta] = useState("");
  const [resolvedEmotion, setResolvedEmotion] = useState(null);
  const [adaptedText, setAdaptedText] = useState(null);
  const [images, setImages] = useState([]);
  const [currentImage, setCurrentImage] = useState(null);
  const audioRef = useRef(null);

  const onTimeUpdate = () => {
    const t = audioRef.current ? audioRef.current.currentTime : 0;
    const scene = images.find((s) => t >= s.start_time_s && t < s.end_time_s) || images[images.length - 1];
    if (scene) setCurrentImage(scene.url);
  };

  const goToPreview = () => {
    if (!text.trim()) { setStatus({ text: "Enter some text first.", cls: "error" }); return; }
    setStatus({ text: "", cls: "" });
    setStep("preview");
  };

  const generate = async () => {
    setStep("generating");
    setImages([]); setCurrentImage(null); setAdaptedText(null);
    const t0 = performance.now();
    try {
      const body = {
        text, speed: parseFloat(speed), bgm, images: withImages,
        max_images: parseInt(maxImages, 10) || 4, culture_adapt: cultureAdapt,
      };
      if (language) body.language = language;
      if (emotion) body.emotion = emotion;
      const resp = await fetch(API_BASE + "/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error(await readError(resp));

      const resolvedEm = resp.headers.get("X-Resolved-Emotion");
      const storyId = resp.headers.get("X-Story-Id");
      const imageCount = parseInt(resp.headers.get("X-Image-Count") || "0", 10);
      setResolvedEmotion(resolvedEm && resolvedEm !== "none" ? resolvedEm : null);
      if (resp.headers.get("X-Culture-Adapted") === "true") {
        const adaptedB64 = resp.headers.get("X-Adapted-Text-B64");
        if (adaptedB64) setAdaptedText(b64ToUtf8(adaptedB64));
      }

      const blob = await resp.blob();
      setAudioUrl(URL.createObjectURL(blob));
      setMeta(`${Math.round(performance.now() - t0)}ms · ${(blob.size / 1024).toFixed(1)} KB`);

      if (imageCount > 0 && storyId) {
        try {
          const imgResp = await fetch(`${API_BASE}/stories/${storyId}/images`, { headers: authHeaders(apiKey) });
          const imgData = await imgResp.json();
          setImages(imgData.images || []);
          if ((imgData.images || []).length) setCurrentImage(imgData.images[0].url);
        } catch (e) { /* images are an enhancement - narration still works without them */ }
      }

      setStatus({ text: "Done.", cls: "ok" });
      setStep("result");
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
      setStep("preview");
    }
  };

  const startOver = () => {
    setStep("compose");
    setAudioUrl(null); setImages([]); setCurrentImage(null); setAdaptedText(null); setStatus({ text: "", cls: "" });
  };

  const emotionInfo = EMOTION_INFO[emotion] || EMOTION_INFO.neutral;
  const selectedLangName = LANGUAGES.find(([code]) => code === language)?.[1];

  return (
    <div className="card">
      <div className="usp-banner">
        <div className="t">One engine, every language</div>
        <p>Your exact text, narrated - not rewritten - in any of 11 Indian languages, with background music generated live to match the mood of what you wrote. Want the story itself culturally retold per language, not just spoken? That's Dream to Story and Dub Studio.</p>
      </div>
      <h3>Text to speech</h3>

      {step === "compose" && (
        <React.Fragment>
          <Field label="Text">
            <textarea value={text} onChange={(e) => setText(e.target.value)}
              placeholder="Type text in any supported language, or mix in English words..." />
          </Field>
          <div className="row">
            <Field label="Language">
              <select value={language} onChange={(e) => setLanguage(e.target.value)}>
                <option value="">Auto-detect</option>
                {LANGUAGES.map(([code, name]) => <option key={code} value={code}>{name}</option>)}
              </select>
            </Field>
            <Field label="Emotion / genre">
              <select value={emotion} onChange={(e) => setEmotion(e.target.value)}>
                <option value="">None</option>
                {EMOTIONS.map((e) => <option key={e} value={e}>{EMOTION_INFO[e]?.label || e}</option>)}
              </select>
            </Field>
          </div>
          <Field label={`Speed: ${parseFloat(speed).toFixed(2)}x`}>
            <input type="range" min="0.5" max="2.0" step="0.05" value={speed} onChange={(e) => setSpeed(e.target.value)} />
          </Field>
          <ToggleOption id="narrate-bgm" icon="music" checked={bgm} onChange={setBgm}
            label="Add background ambience (mood-matched, procedurally generated)" />
          <ToggleOption id="narrate-images" icon="image" checked={withImages} onChange={setWithImages}
            label="Auto-generate a thumbnail (OpenAI Images - adds latency/cost, on by default - uncheck to skip)" />
          {withImages && (
            <Field label="Max scene images" hint="1 = a single thumbnail. More turns it into a storyboard synced to playback.">
              <input type="number" min="1" max="6" value={maxImages} onChange={(e) => setMaxImages(e.target.value)} />
            </Field>
          )}
          <ToggleOption id="narrate-culture-adapt" icon="globe" checked={cultureAdapt} onChange={setCultureAdapt}
            label="Adapt through the culture pack before narrating (off by default - narrates your exact text as typed; on lightly localizes generic references)" />
          <button className="btn" onClick={goToPreview}>Review before generating</button>
          <div className={`status ${status.cls}`}>{status.text}</div>
        </React.Fragment>
      )}

      {step === "preview" && (
        <React.Fragment>
          <div className="usp-banner">
            <div className="t">Review before generating</div>
            <p>Here's what will actually happen to your text - confirm, or go back and change something.</p>
          </div>
          <div className="preview-list">
            <div className="preview-row">
              <div>
                <div className="pr-label">Language</div>
                <div className="pr-desc">{language ? "Fixed by you" : "Detected from your text's script"}</div>
              </div>
              <div className="pr-value">{selectedLangName || "Auto-detect"}</div>
            </div>
            <div className="preview-row">
              <div>
                <div className="pr-label">Mood / music</div>
                <div className="pr-desc">{emotionInfo.desc}</div>
              </div>
              <div className="pr-value">{emotion ? emotionInfo.label : "None"}</div>
            </div>
            <div className="preview-row">
              <div>
                <div className="pr-label">Background ambience</div>
                <div className="pr-desc">{bgm ? "Procedurally generated, auto-ducked under your voice" : "Off"}</div>
              </div>
              <div className="pr-value">{bgm ? "On" : "Off"}</div>
            </div>
            <div className="preview-row">
              <div>
                <div className="pr-label">Scene illustrations</div>
                <div className="pr-desc">{withImages ? `Up to ${maxImages} AI image(s), synced to playback` : "Off"}</div>
              </div>
              <div className="pr-value">{withImages ? "On" : "Off"}</div>
            </div>
            <div className="preview-row">
              <div>
                <div className="pr-label">Culture adaptation</div>
                <div className="pr-desc">{cultureAdapt ? "Text may be lightly localized before narrating" : "Narrated exactly as typed"}</div>
              </div>
              <div className="pr-value">{cultureAdapt ? "On" : "Off"}</div>
            </div>
            <div className="preview-row">
              <div><div className="pr-label">Speed</div></div>
              <div className="pr-value">{parseFloat(speed).toFixed(2)}x</div>
            </div>
          </div>
          <div className="story-output" style={{ display: "block" }}>
            <div className="label">Your text</div>
            {text.length > 300 ? text.slice(0, 300) + "…" : text}
          </div>
          <div className="row" style={{ marginTop: 4 }}>
            <button className="btn ghost" onClick={() => setStep("compose")}>Back to edit</button>
            <button className="btn" onClick={generate}>Confirm &amp; generate</button>
          </div>
        </React.Fragment>
      )}

      {step === "generating" && <GeneratingAnimation bgm={bgm} images={withImages} />}

      {step === "result" && (
        <React.Fragment>
          <div className={`status ${status.cls}`}>{status.text}</div>
          {resolvedEmotion && <span className="badge neutral">✦ AI detected mood: {resolvedEmotion}</span>}
          {adaptedText && <span className="badge neutral">✦ Culturally adapted before narrating</span>}
          {currentImage && (
            <CoverArt src={API_BASE + currentImage} kicker="Now narrating" title={truncateTitle(adaptedText || text, 90)} />
          )}
          <AudioPlayerCard
            audioUrl={audioUrl} audioRef={audioRef} onTimeUpdate={onTimeUpdate}
            thumbnailUrl={currentImage ? API_BASE + currentImage : null} icon="narrate" title={truncateTitle(adaptedText || text)}
          />
          {adaptedText && (
            <div className="story-output">
              <div className="label">What was actually narrated (culturally adapted)</div>
              {adaptedText}
            </div>
          )}
          {meta && <div className="meta">{meta}</div>}
          <button className="btn ghost" onClick={startOver} style={{ marginTop: 14 }}>Start over</button>
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Clone ---------------- */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function ClonePanel({ apiKey }) {
  const [file, setFile] = useState(null);
  const [refText, setRefText] = useState("");
  const [cloneText, setCloneText] = useState("");
  const [status, setStatus] = useState({ text: "", cls: "" });
  const [audioUrl, setAudioUrl] = useState(null);
  const [meta, setMeta] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!file || !refText.trim() || !cloneText.trim()) {
      setStatus({ text: "Reference audio, reference transcript, and target text are all required.", cls: "error" });
      return;
    }
    setBusy(true); setStatus({ text: "Cloning (30-70s, this is expected)...", cls: "" });
    const t0 = performance.now();
    try {
      const refAudioB64 = await fileToBase64(file);
      const resp = await fetch(API_BASE + "/clone", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify({ text: cloneText, ref_audio_b64: refAudioB64, ref_text: refText }),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      const blob = await resp.blob();
      setAudioUrl(URL.createObjectURL(blob));
      setMeta(`${((performance.now() - t0) / 1000).toFixed(1)}s · ${(blob.size / 1024).toFixed(1)} KB`);
      setStatus({ text: "Done.", cls: "ok" });
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  return (
    <div className="card">
      <h3>Clone a voice</h3>
      <Field label="Reference voice (short audio clip)" hint="A few seconds of clear speech works best.">
        <input type="file" accept="audio/*" onChange={(e) => setFile(e.target.files[0] || null)} />
      </Field>
      <Field label="Reference transcript">
        <textarea value={refText} onChange={(e) => setRefText(e.target.value)}
          placeholder="Exact text spoken in the reference clip above..." />
      </Field>
      <Field label="Text to speak in the cloned voice">
        <textarea value={cloneText} onChange={(e) => setCloneText(e.target.value)}
          placeholder="What should the cloned voice say?" />
      </Field>
      <div className="hint">Proxies to a separate reference-audio-conditioned service and takes 30-70s - that's inherent to the model, not a bug. This is a per-request clone, not a saved Voice Bank entry (see the pitch's Cost section for that roadmap item).</div>
      <button className="btn" onClick={submit} disabled={busy}>{busy ? "Cloning…" : "Clone voice"}</button>
      <div className={`status ${status.cls}`}>{status.text}</div>
      <AudioPlayerCard audioUrl={audioUrl} icon="mic" title={truncateTitle(cloneText) || "Cloned voice"} />
      {meta && <div className="meta">{meta}</div>}
    </div>
  );
}

/* ---------------- Dream to Story ---------------- */
function DreamPanel({ apiKey, onStorySaved }) {
  const [description, setDescription] = useState("A detective named Vikram investigates a locked-room murder in an old mansion, helped by his sharp-witted assistant Priya.");
  const [language, setLanguage] = useState("hin");
  const [withVisual, setWithVisual] = useState(true);
  const [withVideo, setWithVideo] = useState(false);

  const [status, setStatus] = useState({ text: "", cls: "" });
  const [storyText, setStoryText] = useState("");
  const [audioUrl, setAudioUrl] = useState(null);
  const [meta, setMeta] = useState("");
  const [qualityHeaders, setQualityHeaders] = useState(null);
  const [coverImageId, setCoverImageId] = useState(null);
  const [videoAvailable, setVideoAvailable] = useState(false);
  const [busy, setBusy] = useState(false);
  const audioRef = useRef(null);

  const downloadCoverVideo = async () => {
    try {
      const resp = await fetch(`${API_BASE}/stories/${coverImageId}/video`, { headers: authHeaders(apiKey) });
      if (!resp.ok) throw new Error(await readError(resp));
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `story-${coverImageId}.mp4`; a.click();
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    }
  };

  const submit = async () => {
    if (!description.trim()) { setStatus({ text: "Describe a dream, memory, or scene first.", cls: "error" }); return; }
    setBusy(true); setStatus({ text: "Writing and narrating (calls OpenAI, then synthesizes)...", cls: "" });
    setCoverImageId(null); setVideoAvailable(false);
    const t0 = performance.now();
    try {
      const resp = await fetch(API_BASE + "/dream-to-story", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify({
          description, language, visual: withVisual || withVideo, video: withVideo, avatars: withAvatars,
        }),
      });
      if (!resp.ok) throw new Error(await readError(resp));

      const storyB64 = resp.headers.get("X-Story-Text-B64");
      const storyId = resp.headers.get("X-Story-Id");
      const charIds = resp.headers.get("X-Character-Ids");
      const hasImage = resp.headers.get("X-Has-Image") === "true";
      const videoOk = resp.headers.get("X-Video-Available") === "true";
      setQualityHeaders(resp.headers);
      const blob = await resp.blob();
      setAudioUrl(URL.createObjectURL(blob));
      if (storyB64) setStoryText(b64ToUtf8(storyB64));
      if (hasImage && storyId) setCoverImageId(storyId);
      if (videoOk && storyId) setVideoAvailable(true);

      const charNote = charIds ? ` · characters saved: ${charIds}` : " · no named characters found";
      setMeta(`Story #${storyId} · ${((performance.now() - t0) / 1000).toFixed(1)}s${charNote}`);
      setStatus({ text: "Done.", cls: "ok" });
      if (onStorySaved) onStorySaved();
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  return (
    <div className="card">
      <div className="usp-banner">
        <div className="t">One story soul, infinite skins</div>
        <p>Describe a scene once. It's written through your chosen language's own culture pack - real places, festivals, folklore and names, not a generic backdrop - named characters are auto-extracted and saved, the story is scored for cultural/emotional quality before narration, and it comes back with a generated thumbnail by default.</p>
      </div>
      <h3>Dream to Story</h3>
      <Field label="Describe a dream, memory, or scene">
        <textarea value={description} onChange={(e) => setDescription(e.target.value)} />
      </Field>
      <div className="row">
        <Field label="Language"><LangSelect value={language} onChange={setLanguage} /></Field>
      </div>
      <ToggleOption id="dream-visual" icon="image" checked={withVisual} onChange={setWithVisual}
        label="Auto-generate a thumbnail - the story's strongest visual moment (OpenAI Images - adds latency/cost, on by default)" />
      <ToggleOption id="dream-video" icon="video" checked={withVideo} onChange={setWithVideo}
        label="Also compose a downloadable video (thumbnail + full narration, via ffmpeg)" />
      <ToggleOption id="dream-avatars" icon="users" checked={withAvatars} onChange={setWithAvatars}
        label="Generate a portrait avatar for each named character" />
      <button className="btn" onClick={submit} disabled={busy}>{busy ? "Working…" : "Generate story"}</button>
      <div className={`status ${status.cls}`}>{status.text}</div>
      {storyText && (
        <div className="story-output">
          <div className="label">Generated story</div>
          {storyText}
        </div>
      )}
      {qualityHeaders && qualityBadge(qualityHeaders)}
      <AudioPlayerCard
        audioUrl={audioUrl} audioRef={audioRef} icon="sparkle" title={truncateTitle(storyText)}
        thumbnailUrl={coverImageId ? `${API_BASE}/stories/${coverImageId}/image` : null}
      />
      {videoAvailable && coverImageId && (
        <button className="btn ghost small" style={{ marginTop: 10 }} onClick={downloadCoverVideo}>Download video</button>
      )}
      {meta && <div className="meta">{meta}</div>}
    </div>
  );
}

/* ---------------- Stories & Branches ---------------- */
/* Batch language-switching: dub one story into several languages at once
   (POST /stories/{id}/dub), each retold through that language's culture
   pack rather than translated literally. The endpoint returns a JSON
   summary, not audio - each successful variant's audio is streamed
   straight from GET /stories/{variant_id}/audio (a plain, unauthenticated
   GET like the cover-image/video endpoints, so it can be used directly as
   an <audio src>), switched between via a small tab bar. */
function DubPanel({ apiKey, story }) {
  const [selected, setSelected] = useState([]);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState({ text: "", cls: "" });
  const [dubs, setDubs] = useState(null);
  const [activeTab, setActiveTab] = useState(null);

  const toggleLang = (code) => {
    setSelected((prev) => (prev.includes(code) ? prev.filter((c) => c !== code) : [...prev, code]));
  };

  const langName = (code) => (LANGUAGES.find(([c]) => c === code) || [code, code])[1];

  const doDub = async () => {
    if (!selected.length) { setStatus({ text: "Pick at least one language.", cls: "error" }); return; }
    setBusy(true); setDubs(null); setActiveTab(null);
    setStatus({ text: `Dubbing into ${selected.length} language${selected.length > 1 ? "s" : ""}...`, cls: "" });
    try {
      const resp = await fetch(`${API_BASE}/stories/${story.id}/dub`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify({ languages: selected }),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      const data = await resp.json();
      const results = data.dubs || [];
      setDubs(results);
      const firstOk = results.find((d) => d.ok);
      setActiveTab(firstOk ? firstOk.language : null);
      const okCount = results.filter((d) => d.ok).length;
      setStatus({ text: `Dubbed ${okCount}/${results.length} language${results.length === 1 ? "" : "s"}.`, cls: okCount ? "ok" : "error" });
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  const active = dubs && dubs.find((d) => d.language === activeTab);

  return (
    <div>
      <div className="hint" style={{ marginBottom: 4 }}>
        Retells this story in each language you pick - places, festivals and names adapted through that
        language's culture pack, not a literal translation - and narrates all of them in one go.
      </div>
      <div className="lang-chip-grid">
        {LANGUAGES.filter(([code]) => code !== story.language).map(([code, name]) => (
          <button type="button" key={code} className={`lang-chip ${selected.includes(code) ? "selected" : ""}`}
            onClick={() => toggleLang(code)}>
            {selected.includes(code) && <Icon name="check" />}
            {name}
          </button>
        ))}
      </div>
      <button className="btn small" style={{ marginTop: 12 }} onClick={doDub} disabled={busy}>
        {busy ? "Dubbing…" : `Dub into ${selected.length || "…"} language${selected.length === 1 ? "" : "s"}`}
      </button>
      <div className={`status ${status.cls}`}>{status.text}</div>

      {dubs && dubs.length > 0 && (
        <React.Fragment>
          <div className="dub-tabs">
            {dubs.map((d) => (
              <button type="button" key={d.language}
                className={`dub-tab ${activeTab === d.language ? "active" : ""} ${d.ok ? "" : "failed"}`}
                onClick={() => d.ok && setActiveTab(d.language)} disabled={!d.ok}
                title={d.ok ? "" : d.error}>
                {langName(d.language)}{!d.ok && " ⚠"}
              </button>
            ))}
          </div>
          {active && active.ok && (
            <AudioPlayerCard
              key={active.language}
              audioUrl={`${API_BASE}/stories/${active.story_id}/audio`}
              icon="globe"
              title={`${langName(active.language)}${active.quality_overall != null ? ` · Quality ${active.quality_overall}/100` : ""}`}
              thumbnailUrl={story.has_image ? `${API_BASE}/stories/${story.id}/image` : null}
            />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function StoryRow({ apiKey, story, onChanged }) {
  const [openPanel, setOpenPanel] = useState(null); // 'branch' | 'lang' | 'dub' | 'cover' | null
  const [changedDecision, setChangedDecision] = useState("");
  const [targetLang, setTargetLang] = useState("tam");
  const [status, setStatus] = useState({ text: "", cls: "" });
  const [resultAudio, setResultAudio] = useState(null);
  const [resultText, setResultText] = useState("");
  const [videoStatus, setVideoStatus] = useState("");
  const [busy, setBusy] = useState(false);

  const toggle = (panel) => setOpenPanel(openPanel === panel ? null : panel);

  const doBranch = async () => {
    if (!changedDecision.trim()) { setStatus({ text: "Describe the changed decision.", cls: "error" }); return; }
    setBusy(true); setStatus({ text: "Generating branch...", cls: "" });
    try {
      const resp = await fetch(`${API_BASE}/stories/${story.id}/branch`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify({ changed_decision: changedDecision }),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      const storyB64 = resp.headers.get("X-Story-Text-B64");
      const blob = await resp.blob();
      setResultAudio(URL.createObjectURL(blob));
      setResultText(storyB64 ? b64ToUtf8(storyB64) : "");
      setStatus({ text: "Branch created.", cls: "ok" });
      onChanged();
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  const doSwitchLanguage = async () => {
    setBusy(true); setStatus({ text: "Re-rendering in the new language...", cls: "" });
    try {
      const resp = await fetch(`${API_BASE}/stories/${story.id}/switch-language`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify({ language: targetLang }),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      const storyB64 = resp.headers.get("X-Story-Text-B64");
      const blob = await resp.blob();
      setResultAudio(URL.createObjectURL(blob));
      setResultText(storyB64 ? b64ToUtf8(storyB64) : "");
      setStatus({ text: `Now available in ${targetLang}.`, cls: "ok" });
      onChanged();
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  const doDownloadCoverVideo = async () => {
    setVideoStatus("Composing cover video (ffmpeg)...");
    try {
      const resp = await fetch(`${API_BASE}/stories/${story.id}/video`, { headers: authHeaders(apiKey) });
      if (!resp.ok) throw new Error(await readError(resp));
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `story-${story.id}-cover.mp4`; a.click();
      setVideoStatus("Downloaded.");
    } catch (err) {
      setVideoStatus(err.message || String(err));
    }
  };

  const doDelete = async () => {
    const label = story.title || `Story #${story.id}`;
    if (!window.confirm(`Delete "${label}"? Branches/variants of it and any characters it introduced are kept - only this story itself is removed. This can't be undone.`)) return;
    setBusy(true); setStatus({ text: "Deleting...", cls: "" });
    try {
      const resp = await fetch(`${API_BASE}/stories/${story.id}`, { method: "DELETE", headers: authHeaders(apiKey) });
      if (!resp.ok) throw new Error(await readError(resp));
      onChanged();
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
      setBusy(false);
    }
  };

  return (
    <div>
      <div className="story-card">
        <div className={`story-card-thumb ${story.has_image ? "clickable" : ""}`} onClick={() => story.has_image && toggle("cover")}>
          {story.has_image
            ? <img src={`${API_BASE}/stories/${story.id}/image`} alt="" />
            : <div className="story-card-thumb-fallback"><Icon name="book" /></div>}
        </div>
        <div className="story-card-body">
          <div className="story-card-title">#{story.id}: {story.title || "(untitled)"}</div>
          <div className="story-card-sub">
            {LANGUAGES.find(([c]) => c === story.language)?.[1] || story.language}
            {story.parent_story_id ? ` · branched from #${story.parent_story_id}` : ""}
            {story.variant_of_story_id ? ` · language variant of #${story.variant_of_story_id}` : ""}
          </div>
          <div className="story-card-actions">
            <button className="btn ghost small" onClick={() => toggle("branch")}>Branch</button>
            <button className="btn ghost small" onClick={() => toggle("lang")}>Switch language</button>
            <button className="btn ghost small" onClick={() => toggle("dub")}>Dub</button>
            {!!story.has_image && <button className="btn ghost small" onClick={() => toggle("cover")}>Cover</button>}
            {!!(story.has_image && story.has_audio) && <button className="btn ghost small" onClick={doDownloadCoverVideo}>Cover video</button>}
            <button className="btn ghost small danger" onClick={doDelete} disabled={busy} title="Delete this story">
              <Icon name="trash" /> Delete
            </button>
          </div>
        </div>
      </div>
      {videoStatus && <div className="hint" style={{ marginLeft: 14 }}>{videoStatus}</div>}
      {openPanel === "cover" && !!story.has_image && (
        <div className="inline-form">
          <CoverArt
            src={`${API_BASE}/stories/${story.id}/image`} alt="Story cover"
            kicker={LANGUAGES.find(([c]) => c === story.language)?.[1] || story.language}
            title={story.title || `Story #${story.id}`}
          />
        </div>
      )}

      {openPanel === "branch" && (
        <div className="inline-form">
          <textarea placeholder="What changes at some point in this story?" value={changedDecision}
            onChange={(e) => setChangedDecision(e.target.value)} />
          <button className="btn small" onClick={doBranch} disabled={busy}>Generate branch</button>
          <div className={`status ${status.cls}`}>{status.text}</div>
          <AudioPlayerCard
            audioUrl={resultAudio} icon="branch" title={truncateTitle(resultText) || "Branch narration"}
            thumbnailUrl={story.has_image ? `${API_BASE}/stories/${story.id}/image` : null}
          />
        </div>
      )}
      {openPanel === "lang" && (
        <div className="inline-form">
          <div className="row">
            <div style={{ maxWidth: 220 }}><LangSelect value={targetLang} onChange={setTargetLang} /></div>
            <button className="btn small" onClick={doSwitchLanguage} disabled={busy}>Re-render in this language</button>
          </div>
          <div className={`status ${status.cls}`}>{status.text}</div>
          <AudioPlayerCard
            audioUrl={resultAudio} icon="narrate" title={truncateTitle(resultText) || "Language variant"}
            thumbnailUrl={story.has_image ? `${API_BASE}/stories/${story.id}/image` : null}
          />
        </div>
      )}
      {openPanel === "dub" && (
        <div className="inline-form"><DubPanel apiKey={apiKey} story={story} /></div>
      )}
    </div>
  );
}

function ServiceRow({ svc }) {
  const [state, setState] = useState({ status: "pending", detail: "checking...", time: "" });

  const check = useCallback(async () => {
    setState({ status: "pending", detail: "checking...", time: "" });
    const t0 = performance.now();
    try {
      const resp = await fetch(`http://178.104.214.191:${svc.port}${svc.path}`, { signal: AbortSignal.timeout(8000) });
      const elapsed = Math.round(performance.now() - t0);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      setState({ status: "up", detail: svc.format(data), time: `${elapsed}ms` });
    } catch (err) {
      const elapsed = Math.round(performance.now() - t0);
      setState({ status: "down", detail: err.name === "TimeoutError" ? "timed out" : "unreachable", time: `${elapsed}ms` });
    }
  }, [svc]);

  useEffect(() => { check(); }, [check]);

  return (
    <div className="svc-row">
      <span className={`dot-status ${state.status}`}></span>
      <span className="svc-name">{svc.name}</span>
      <span className="svc-detail">{state.detail}</span>
      <span className="hint">{state.time}</span>
    </div>
  );
}

/* variant="sidebar" groups items under labeled sections (Create / Library

   ten equally-weighted items. variant="mobile" (the default) keeps the

   next to each other there. */
function NavItems({ activeTab, setActiveTab, variant }) {
  if (variant !== "sidebar") {
    return TABS.map((t) => <NavItem key={t.id} t={t} activeTab={activeTab} setActiveTab={setActiveTab} />);

  const overview = TABS.find((t) => !t.section);

        <React.Fragment key={section.id}>

            <NavItem key={t.id} t={t} activeTab={activeTab} setActiveTab={setActiveTab} />

  ["places", "Places", "Real landmarks for scenes that need a setting."],
  ["festivals", "Festivals", "Real festivals for scenes that need a time/occasion."],
  ["folklore", "Folklore", "Regional folk-spirit/legend motifs, for horror/mystery genres."],

function CulturePackEditor({ apiKey, language, name, onImageInvalidated }) {
  const [fields, setFields] = useState(null);
  const [status, setStatus] = useState({ text: "", cls: "" });
  const [busy, setBusy] = useState(false);

  const load = useCallback(() => {
    setFields(null);
    fetch(`${API_BASE}/culture/${language}`, { headers: authHeaders(apiKey) })
      .then((r) => r.json()).then(setFields)
      .catch((e) => setStatus({ text: e.message || String(e), cls: "error" }));
  }, [apiKey, language]);

  useEffect(load, [load]);

  const setField = (key, value) => setFields((f) => ({ ...f, [key]: value }));

  const save = async () => {
    setBusy(true); setStatus({ text: "Saving…", cls: "" });
    try {
      const body = {};
      for (const [key] of CULTURE_PACK_FIELDS) body[key] = fields[key] ?? "";
      const resp = await fetch(`${API_BASE}/culture/${language}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", ...authHeaders(apiKey) },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      setFields(await resp.json());
      setStatus({ text: "Saved. The cultural image will regenerate next time it's viewed.", cls: "ok" });
      onImageInvalidated(language);
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  const reset = async () => {
    setBusy(true); setStatus({ text: "Resetting to default…", cls: "" });
    try {
      const resp = await fetch(`${API_BASE}/culture/${language}/override`, {
        method: "DELETE", headers: authHeaders(apiKey),
      });
      if (!resp.ok) throw new Error(await readError(resp));
      setFields(await resp.json());
      setStatus({ text: "Reverted to the built-in default.", cls: "ok" });
      onImageInvalidated(language);
    } catch (err) {
      setStatus({ text: err.message || String(err), cls: "error" });
    } finally { setBusy(false); }
  };

  return (
    <div className="card culture-editor">
      <h3>Editing: {name}</h3>
      {!fields ? (
        <div className="hint">Loading…</div>
      ) : (
        <React.Fragment>
          {CULTURE_PACK_FIELDS.map(([key, label, hint]) => (
            <Field key={key} label={label} hint={hint}>
              <textarea value={fields[key] || ""} onChange={(e) => setField(key, e.target.value)} style={{ minHeight: 56 }} />
            </Field>
          ))}
          <div className="row" style={{ marginTop: 4 }}>
            <button className="btn" onClick={save} disabled={busy}>Save changes</button>
            <button className="btn ghost" onClick={reset} disabled={busy}>Reset to default</button>
          </div>
          <div className={`status ${status.cls}`}>{status.text}</div>
        </React.Fragment>
      )}
    </div>
  );
}

function CultureGallery({ apiKey }) {
  const [loaded, setLoaded] = useState({});
  const [failed, setFailed] = useState({});
  const [imageVersion, setImageVersion] = useState({});
  const [editing, setEditing] = useState(null); // language code, or null

  const invalidate = (code) => {
    // Editing a language's places changes what the cached image should
    // show - drop the local "already loaded" flag so the tile re-fetches
    // (the server has already deleted its own cache copy) instead of
    // silently continuing to display the stale image.
    setLoaded((l) => { const next = { ...l }; delete next[code]; return next; });
    setFailed((f) => { const next = { ...f }; delete next[code]; return next; });
    setImageVersion((v) => ({ ...v, [code]: (v[code] || 0) + 1 }));
  };

  return (
    <div>
      <div className="card">
        <h3>Explore &amp; edit the culture packs</h3>
        <p className="hint" style={{ marginBottom: 14 }}>Representative cultural images load automatically and stay cached after the first generation. Use Edit to change what a language's culture pack actually contains.</p>
        <div className="culture-grid">
          {LANGUAGES.map(([code, name]) => (
            <div className="culture-tile" key={code}>
              <div style={{ position: "absolute", inset: 0 }}>
                {!failed[code] && (
                  <img
                    src={`${API_BASE}/culture/${code}/image?v=${imageVersion[code] || 0}`}
                    alt=""
                    onLoad={() => setLoaded((l) => ({ ...l, [code]: true }))}
                    onError={() => setFailed((f) => ({ ...f, [code]: true }))}
                    style={{ opacity: loaded[code] ? 1 : 0 }}
                  />
                )}
                {!loaded[code] && !failed[code] && <div className="culture-tile-loading">Generating…</div>}
                {failed[code] && <div className="culture-tile-placeholder">✦</div>}
              </div>
              <button
                className="culture-tile-edit"
                onClick={(e) => { e.stopPropagation(); setEditing(editing === code ? null : code); }}
              >Edit</button>
              <div className="culture-tile-label">{name}</div>
            </div>
          ))}
        </div>
      </div>
      {editing && (
        <CulturePackEditor
          apiKey={apiKey} language={editing}
          name={(LANGUAGES.find(([c]) => c === editing) || [, editing])[1]}
          onImageInvalidated={invalidate}
        />
      )}
    </div>
  );
}

function OverviewPanel({ apiKey, setActiveTab, refreshToken }) {
  const [stats, setStats] = useState({ stories: null, characters: null, backlog: null });
  const [health, setHealth] = useState(null);

  useEffect(() => {
    // /stories has no count endpoint - fetch a generous page and use its
    // length as a floor (good enough for a dashboard tile, not an exact count).
    fetch(`${API_BASE}/stories?limit=500`, { headers: authHeaders(apiKey) })
      .then((r) => r.json()).then((d) => setStats((s) => ({ ...s, stories: (d.stories || []).length })))
      .catch(() => setStats((s) => ({ ...s, stories: "—" })));
    fetch(`${API_BASE}/characters?limit=500`, { headers: authHeaders(apiKey) })
      .then((r) => r.json()).then((d) => setStats((s) => ({ ...s, characters: (d.characters || []).length })))
      .catch(() => setStats((s) => ({ ...s, characters: "—" })));
    fetch(`${API_BASE}/quality/backlog?limit=500`, { headers: authHeaders(apiKey) })
      .then((r) => r.json()).then((d) => setStats((s) => ({ ...s, backlog: (d.backlog || []).length })))
      .catch(() => setStats((s) => ({ ...s, backlog: "—" })));
    fetch(`${API_BASE}/health`, { headers: authHeaders(apiKey) })
      .then((r) => r.json()).then(setHealth)
      .catch(() => setHealth(null));
  }, [apiKey, refreshToken]);

  const actions = [
    { tab: "dream", icon: "sparkle", label: "Dream to Story", sub: "Describe a scene, get a narrated story" },
    { tab: "villain", icon: "villain", label: "Personalized villain", sub: "Built around a listener's fears" },
    { tab: "stories", icon: "branch", label: "Branch a story", sub: "Re-fork from a changed decision" },
    { tab: "narrate", icon: "narrate", label: "Text to speech", sub: "11 languages, mood-matched ambience" },
  ];

  return (
    <div>
      <div className="usp-banner">
        <div className="t">One story. Infinite cultures.</div>
        <p>Built for the listener the internet still dubs over - the same character, the same moment, told with someone's own festivals, landmarks, and voice, in whichever of 11 languages they reach for.</p>
      </div>

      <div className="stat-grid" style={{ marginBottom: 18 }}>
        <div className="stat-card">
          <div className="stat-icon"><Icon name="book" /></div>
          <div className="stat-value">{stats.stories ?? "…"}</div>
          <div className="stat-label">Stories generated</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon"><Icon name="users" /></div>
          <div className="stat-value">{stats.characters ?? "…"}</div>
          <div className="stat-label">Persistent characters</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon"><Icon name="check" /></div>
          <div className="stat-value">{stats.backlog ?? "…"}</div>
          <div className="stat-label">In quality backlog</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon"><Icon name="clock" /></div>
          <div className="stat-value">{health ? `${health.languages_loaded?.length ?? 11}` : "…"}</div>
          <div className="stat-label">Languages live</div>
        </div>
      </div>

      <div className="card">
        <h3>Quick actions</h3>
        <div className="quick-actions">
          {actions.map((a) => (
            <div className="quick-action" key={a.tab} onClick={() => setActiveTab(a.tab)}>
              <div className="qa-icon"><Icon name={a.icon} /></div>
              <div>
                <div className="qa-label">{a.label}</div>
                <div className="qa-sub">{a.sub}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h3>System status</h3>
        <div className="health-strip">
          <span className="health-pill">{health ? "● API reachable" : "○ checking…"}</span>
          {health && <span className="health-pill">CPU threads: {health.cpu_threads}</span>}
          {health && <span className="health-pill">emotion auto: {String(health.emotion_auto_available)}</span>}
        </div>
        <div className="hint" style={{ marginTop: 10 }}>See the Services tab for live per-service status of every backing service this UI talks to.</div>
      </div>

      <CultureGallery apiKey={apiKey} />
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("overview");
  const [apiKey, setApiKey] = useApiKey();
  const [refreshToken, setRefreshToken] = useState(0);
  const bump = () => setRefreshToken((x) => x + 1);
  const meta = TAB_META[activeTab];

  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="brand">
          <img src="logo.png" alt="Infinity Studio" />
          <div className="brand-text">
            <div className="brand-name">INFINITY STUDIO</div>
            <div className="brand-sub">Cultural Story OS</div>
          </div>
        </div>
        <div className="navlist"><NavItems variant="sidebar" activeTab={activeTab} setActiveTab={setActiveTab} /></div>
        <div className="apikey-box">
          <label>API key</label>
          <input type="password" placeholder="x-api-key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
        </div>
      </div>

      <div className="mobile-tabs">
        <NavItems activeTab={activeTab} setActiveTab={setActiveTab} />
      </div>

      <div className="main">
        <div className="page-head">
          <h1 className="page-title">{meta.title}</h1>
          <p className="page-sub">{meta.sub}</p>
        </div>

        {activeTab === "overview" && <OverviewPanel apiKey={apiKey} setActiveTab={setActiveTab} refreshToken={refreshToken} />}
        {activeTab === "narrate" && <NarratePanel apiKey={apiKey} />}
        {activeTab === "clone" && <ClonePanel apiKey={apiKey} />}
        {activeTab === "dream" && <DreamPanel apiKey={apiKey} onStorySaved={bump} />}
        {activeTab === "villain" && <VillainPanel apiKey={apiKey} onStorySaved={bump} />}
        {activeTab === "dub" && <DubStudioPanel apiKey={apiKey} refreshToken={refreshToken} />}
        {activeTab === "stories" && <StoriesPanel apiKey={apiKey} refreshToken={refreshToken} />}
        {activeTab === "characters" && <CharactersPanel apiKey={apiKey} refreshToken={refreshToken} />}
        {activeTab === "quality" && <QualityPanel apiKey={apiKey} />}
        {activeTab === "services" && <ServicesPanel />}
        {activeTab === "config" && <ConfigPanel apiKey={apiKey} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
